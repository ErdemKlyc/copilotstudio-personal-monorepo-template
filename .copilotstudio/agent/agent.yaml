# Maker-facing configuration reference for setting up "Assistant" in Microsoft
# Copilot Studio. This is NOT a `pac`-importable solution file — Copilot Studio
# agents are authored in the maker portal (or via the Agents SDK/`pac` CLI with
# real solution GUIDs this template can't fabricate). Treat this as the
# checklist of values to enter by hand in Agent > Overview / Settings, kept in
# source control so the configuration is reviewable and versioned like the
# rest of this vault.
#
# Replaces the original template's .codex/plugins/assistant/plugin.json
# (a ChatGPT-Apps-style manifest, which has no Copilot Studio equivalent).

name: assistant
version: "0.1.0"

overview:
  display_name: "Assistant"
  description: >
    A long-running work companion that helps map context, run first-meeting
    onboarding, and prepare useful follow-ups, backed by this repo as a
    shared-memory vault.
  icon: assets/assistant/assistant-froge.png
  instructions_file: instructions.md   # paste into Agent > Overview > Instructions

conversation_starters:
  - "Onboard me."
  - "Help me stay on top of my work today."
  - "Set a goal to {outcome}."
  - "Start a new project called {name}."

# Knowledge sources: Copilot Studio does not read a git repo directly. Sync
# this vault to a location one of its native connectors can read, then add it
# as a Knowledge source under Agent > Knowledge > Add knowledge.
knowledge_sources:
  - type: sharepoint_or_onedrive
    note: >
      Sync this repo (or a mirror of it) to a SharePoint document library or
      OneDrive folder, then add that folder as a Knowledge source. This is how
      projects/, experiments/, people/, and templates/ become readable by the
      agent.
  - type: public_website
    note: >
      Optional alternative if this vault is published as a static site
      (for example via GitHub Pages) and you only need read access, not write-back.

# Tools: each Topic below maps to a folder in .copilotstudio/topics/. What's
# available under Tools > Add a tool varies by tenant -- some enterprise
# environments disable Flow, MCP, Custom connector, and REST API entirely,
# leaving only prebuilt Connector actions. Check before assuming any one
# path below is available; see connector_tools and .copilotstudio/README.md.
topics:
  - assistant
  - onboarding
  - loop
  - ultragoal
  - new-person
  - new-project
  - write-like-me-bootstrap
  - simple-html-artifact
  - audit-ai-code
  - audit-ai-frontend
  - audit-ai-writing
  - gh-commit
  - gh-address-comments
  - gh-fix-ci
  - yeet

# Default write-back path when only prebuilt Connector actions are available
# (Flow/MCP/Custom connector/REST API disabled -- the common enterprise-
# lockdown case). One connector action added directly as a Tool, no flow in
# between. Full setup: .copilotstudio/README.md > "The create-vault-file /
# create-vault-folder Tools".
connector_tools:
  - name: create-vault-file
    used_by: [new-person, new-project]
    connector: "SharePoint or OneDrive for Business"
    action: "Create file"
    note: "Does not auto-create missing folders -- pair with create-vault-folder for new subfolders."
  - name: create-vault-folder
    used_by: [new-project]
    connector: "SharePoint or OneDrive for Business"
    action: "Create new folder"

# If your tenant instead allows Agent flow, Custom connector, or REST API
# tool types, those are equally valid ways to build the same logic -- see
# each topic's Platform Notes for the flow/REST-call version.

# gh-address-comments/gh-fix-ci additionally depend on whether a GitHub
# connector with the right actions exists in your tenant at all. Not
# guaranteed either way -- check the Connector picker for "GitHub" before
# assuming these topics work. See .copilotstudio/README.md > "GitHub Topics".

# gh-commit and yeet need a live git working tree, which no Copilot Studio
# Tool can provide in any tenant configuration. Not solvable here by design
# — see their TOPIC.md Platform Notes. Run them from a coding agent with
# real repo/shell access instead (for example GitHub Copilot's coding agent).

tools:
  - name: vault-tools-mcp
    type: mcp_server
    note: >
      Optional alternative to the connector Tools above, only worthwhile
      with genuine persistent, IT-approved hosting (not a free-tier/
      ephemeral host, which loses every write on restart) and a tenant
      where MCP tool registration is actually enabled. See tools/README.md.
  - name: browser-automation
    type: mcp_server_or_connector
    note: >
      Optional. Needed only for the browser-QA steps in audit-ai-frontend.

publish_channels:
  - microsoft_teams
  - custom_website
  - m365_copilot   # publish as an agent inside Microsoft 365 Copilot, if licensed

# Requires generative orchestration turned on (it's the default for new
# agents; verify at Settings > Generative AI > Orchestration if unsure or if
# this agent predates that default), and in some tenants an admin must turn
# on "solution-aware cloud flow sharing" for the environment before Triggers
# appears on the Overview page at all.
triggers:
  - name: "Assistant hourly check-in"
    type: recurrence   # Overview page > Triggers > Add trigger > Recurrence
    recurrence: hourly
    note: "Created via the loop topic once the user approves a recurring check-in."
